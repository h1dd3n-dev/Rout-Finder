<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Glowing Emblem Background -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" fill-opacity="0.08"/>

  <!-- Bank / Institution Icon -->
  <g transform="translate(146, 136) scale(9.2)" fill="none" stroke="url(#cardGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="rgba(6, 182, 212, 0.15)"/>
    <polyline points="9 22 9 12 15 12 15 22"/>
  </g>

  <!-- Routing Flow Arrows / Tech Accent -->
  <circle cx="256" cy="380" r="12" fill="#10b981"/>
  <circle cx="216" cy="380" r="6" fill="#38bdf8"/>
  <circle cx="296" cy="380" r="6" fill="#38bdf8"/>
</svg>
